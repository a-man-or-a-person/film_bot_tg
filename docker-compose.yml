services:
    bot:
        container_name: film_bot_tg
        image: filmbottg
        build:
            context: .
            dockerfile: ./Dockerfile
        env_file:
            - .env
        depends_on:
            - db

    db:
        container_name: postgres
        image: postgres:17.0
        command: "postgres -c config_file=/config/postgresql.conf"
        env_file:
            - .env
        

